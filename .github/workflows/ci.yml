name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Pushes to main are never cancelled or
# dropped: each commit gets its own group (a shared group would still replace a pending run), so
# every main commit keeps a CI result (RELEASING.md relies on it before merging the version PR).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # Dependency install scripts are skipped in every job, as in release.yml, so CI also proves
      # that build and tests work without them.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests with coverage, once: fails when coverage falls under the thresholds in
      # vitest.config.ts. The test job below runs them again on every Node/Nest combination.
      - run: npm run test:cov
      - run: npm run build
      - run: npm run typecheck:bench
      - run: npm run check:pkg
      - run: npm run check:pack
      # The build above is reused: docs:check:only skips docs:check's own build.
      - run: npm run docs:check:only
      - run: npm run check:workflows

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [11, 12]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Nest 11
        if: matrix.nest == 11
        run: npm install --no-save --ignore-scripts @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11 @nestjs/terminus@^11
      - name: Print resolved Nest version
        run: |
          for p in core common testing terminus; do
            node -p "const v = JSON.parse(require('node:fs').readFileSync('node_modules/@nestjs/$p/package.json', 'utf8')).version; '@nestjs/$p@' + v"
          done
      - run: npm test
      - run: npm run test:int

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Install the root devDependencies with Node 24 (some need a newer Node than 22.12),
      # then run the smoke fixtures on the matrix Node.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Switch to Node ${{ matrix.node }}
        if: matrix.node != 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node scripts/smoke.mjs

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run example:check

  # Single required status check for branch protection: fails unless every job above succeeded.
  # Branch protection counts a skipped required check as passing, so this job must never be
  # skipped: without an `if` a failed need would skip it, and with `!cancelled()` a cancelled run
  # would. `always()` makes it run (and fail) whenever a need failed, was skipped, timed out or
  # was cancelled. A pull request run superseded by a newer push therefore shows a red `ci-ok` on
  # its old commit; that is harmless, because branch protection checks the head commit, whose own
  # run reports `ci-ok`. `npm run check:workflows` guards the `if` and the `needs` list.
  ci-ok:
    if: always()
    needs: [checks, test, smoke, example]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required CI job did not succeed (result: $r)"
              exit 1
            fi
          done
